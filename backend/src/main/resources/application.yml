spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/e1}
    username: ${DB_USER:e1}
    password: ${DB_PASSWORD:e1}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  servlet:
    multipart:
      max-file-size: 8MB
      max-request-size: 40MB

server:
  port: ${PORT:8080}

proofs:
  dir: ${PROOFS_DIR:./data/proofs}
  max-per-submission: ${PROOFS_MAX_PER_SUBMISSION:10}
  max-per-category: ${PROOFS_MAX_PER_CATEGORY:5}
  max-image-bytes: 8388608

reminders:
  tick-ms: ${REMINDERS_TICK_MS:300000}

push:
  vapid:
    public-key: ${VAPID_PUBLIC_KEY:}
    private-key: ${VAPID_PRIVATE_KEY:}
    subject: ${VAPID_SUBJECT:https://my-race-engineer.rrriooo.com}

app:
  url: ${APP_URL:https://my-race-engineer.rrriooo.com}

admin:
  username: ${ADMIN_USER:admin}
  password: ${ADMIN_PASSWORD:admin}
