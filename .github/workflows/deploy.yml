name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      # a few seconds; a red test stops the deploy
      - run: npm test
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - uses: actions/upload-artifact@v4
        with:
          name: frontend
          path: frontend/dist

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      # unit tests only (no Spring context, no database): they add seconds, and a red test stops the deploy
      - run: mvn -B -q package
        working-directory: backend
      - run: cp backend/target/*.jar app.jar
      - uses: actions/upload-artifact@v4
        with:
          name: backend
          path: app.jar

  deploy:
    needs: [frontend, backend]
    runs-on: ubuntu-latest
    env:
      TARGET: ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: frontend
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: backend
          path: .

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -H "${{ secrets.SSH_HOST }}" >> ~/.ssh/known_hosts
          printf "Host *\n  IdentityFile ~/.ssh/id_deploy\n" > ~/.ssh/config

      - name: Backend and database
        env:
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
        run: |
          printf "DB_PASSWORD=%s\nADMIN_PASSWORD=%s\nVAPID_PUBLIC_KEY=%s\nVAPID_PRIVATE_KEY=%s\n" "$DB_PASSWORD" "$ADMIN_PASSWORD" "$VAPID_PUBLIC_KEY" "$VAPID_PRIVATE_KEY" > .env
          chmod 600 .env
          scp app.jar deploy/docker-compose.yml .env "$TARGET:/opt/my-race-engineer/"
          rm .env
          ssh "$TARGET" '
            set -e
            cd /opt/my-race-engineer
            chmod 600 .env
            docker compose up -d db
            docker compose up -d --force-recreate backend
            docker image prune -f >/dev/null
          '

      - name: Frontend
        run: rsync -az --delete dist/ "$TARGET:/srv/my-race-engineer/"
